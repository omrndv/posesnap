<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
  <defs>
    <linearGradient id="btsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="hairBts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2d54"/>
      <stop offset="100%" stop-color="#1e162b"/>
    </linearGradient>
    <linearGradient id="skinBts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffeedd"/>
      <stop offset="100%" stop-color="#fcd5ce"/>
    </linearGradient>
    <filter id="shadowBts" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#shadowBts)">
    <!-- Badge Label -->
    <rect x="30" y="30" width="130" height="32" rx="16" fill="url(#btsGrad)"/>
    <text x="95" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">💜 BTS Bias</text>

    <!-- Torso / Purple Stage Outfit -->
    <path d="M 40 480 C 40 340 70 290 120 270 L 160 290 L 200 270 C 250 290 280 340 280 480 Z" fill="#2e1065"/>
    <path d="M 120 270 L 160 360 L 200 270 Z" fill="#9333ea"/>
    <path d="M 145 270 L 160 310 L 175 270 Z" fill="#ffffff"/>
    
    <!-- Neck -->
    <rect x="142" y="220" width="36" height="60" rx="8" fill="url(#skinBts)"/>

    <!-- Head -->
    <ellipse cx="160" cy="180" rx="60" ry="70" fill="url(#skinBts)"/>
    
    <!-- Ears & Earring -->
    <ellipse cx="98" cy="185" rx="10" ry="16" fill="url(#skinBts)"/>
    <ellipse cx="222" cy="185" rx="10" ry="16" fill="url(#skinBts)"/>
    <circle cx="98" cy="198" r="3" fill="#e2e8f0"/>
    <line x1="98" y1="200" x2="98" y2="212" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Eyes (Wink) -->
    <!-- Left Wink -->
    <path d="M 124 175 Q 138 185 150 175" stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Right Open Eye -->
    <circle cx="182" cy="175" r="7" fill="#1e293b"/>
    <circle cx="180" cy="172" r="2.5" fill="#ffffff"/>

    <!-- Blush -->
    <ellipse cx="125" cy="192" rx="12" ry="6" fill="#f43f5e" opacity="0.35"/>
    <ellipse cx="195" cy="192" rx="12" ry="6" fill="#f43f5e" opacity="0.35"/>

    <!-- Smile with Dimple -->
    <path d="M 148 205 Q 160 220 172 205" stroke="#e11d48" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="138" cy="204" r="2" fill="#fda4af"/>

    <!-- Hair (Fluffy BTS Style) -->
    <path d="M 94 170 C 85 105 110 80 160 80 C 210 80 235 105 226 170 C 210 120 185 115 160 115 C 135 115 110 120 94 170 Z" fill="url(#hairBts)"/>
    <path d="M 125 115 Q 140 160 130 168" stroke="url(#hairBts)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M 155 115 Q 165 158 158 168" stroke="url(#hairBts)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M 190 115 Q 185 160 175 168" stroke="url(#hairBts)" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- Half-Heart Hand (Pose partner with user) -->
    <g transform="translate(18, 220)">
      <!-- Arm extending to frame center -->
      <path d="M 50 80 C 20 60 10 30 25 10 C 35 -5 55 10 60 30" stroke="url(#skinBts)" stroke-width="26" stroke-linecap="round" fill="none"/>
      <!-- Half Heart curve hand -->
      <path d="M 28 10 C 20 0 10 -10 0 10 C -10 30 15 55 25 65" stroke="url(#skinBts)" stroke-width="18" stroke-linecap="round" fill="none"/>
      <!-- Floating purple hearts -->
      <path d="M -5 -8 C -5 -12 -11 -16 -15 -12 C -19 -8 -15 -2 -5 4 C 5 -2 9 -8 5 -12 C 1 -16 -5 -12 -5 -8 Z" fill="#a855f7"/>
    </g>
  </g>
</svg>
